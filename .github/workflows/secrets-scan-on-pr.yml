name: Security Scan for Leaked Secrets

# Scans the commits introduced by the PR (or push) with the gitleaks CLI.
# The CLI is used instead of gitleaks-action, which requires a license key for organization repos.

on:
  workflow_call:
  pull_request:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history so gitleaks can scan base..head

      - name: Run gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --verbose --log-opts="$BASE..$HEAD"
